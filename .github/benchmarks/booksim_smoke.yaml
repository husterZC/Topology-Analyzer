benchmark:
  type: latency_vs_injection_rate
  injection_rates: [0.01]
  injection_rate_unit: flits/node/cycle
  packet_size: 1
  traffic: uniform
  warmup_cycles: 100
  sample_cycles: 500
  max_samples: 1
  repetitions: 1
  num_vcs: 2
  vc_buffer_size: 8
  router_latency: 1
  timeout_seconds: 60
  stop_on_error: true

systems:
  - ../../examples/systems/mesh2d/xy/mesh2d_2x2_xy.yaml

booksim:
  executable: booksim
  backend: auto

output_dir: runs

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  MPLCONFIGDIR: .cache/matplotlib

jobs:
  test:
    name: Python 3.10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check benchmark dry-run
        run: |
          topoanalyzer benchmark \
            examples/benchmarks/mesh2d/latency_vs_injection_mesh2d.yaml \
            --dry-run \
            --no-progress

      - name: Check system regression materialization
        run: |
          topoanalyzer benchmark \
            examples/benchmarks/system_regression/latency_vs_injection_ci_materialize.yaml \
            --dry-run \
            --no-progress

      - name: Install BookSim build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison

      - name: Install BookSim
        run: BOOTSTRAP_PYTHON=python make booksim-link

      - name: Check benchmark booksim
        run: |
          topoanalyzer benchmark \
            .github/benchmarks/booksim_smoke.yaml \
            --no-progress

      - name: Check system regression booksim
        run: |
          topoanalyzer benchmark \
            examples/benchmarks/system_regression/latency_vs_injection_booksim_smoke.yaml \
            --no-progress

      - name: Check adaptive runtime booksim
        run: |
          topoanalyzer benchmark \
            examples/benchmarks/system_regression/latency_vs_injection_adaptive_runtime_booksim_smoke.yaml \
            --no-progress

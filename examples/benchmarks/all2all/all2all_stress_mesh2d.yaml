benchmark:
  type: all2all_stress
  transfer_sizes: [8, 16, 32, 64]
  transfer_size_unit: flits
  packet_size: 4
  packetization: fixed_packet_size
  traffic: all2all
  injection_rate: 1.0
  injection_rate_unit: packets/node/cycle
  batch_count: 1
  repetitions: 1
  num_vcs: 2
  vc_buffer_size: 8
  router_latency: 1
  timeout_seconds: 120
  stop_on_error: false

plot:
  x_scale: linear
  y_scale: linear
  emit_companion_plot: true

systems:
  - ../../systems/mesh2d/xy/mesh2d_4x4_xy.yaml

booksim:
  executable: booksim
  backend: anynet_table

output_dir: runs

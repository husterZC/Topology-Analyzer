benchmark:
  type: latency_vs_injection_rate
  # 0.001 + 0.004*n while staying within [0.001, 0.1].
  injection_rates:
    - 0.001
    - 0.005
    - 0.009
    - 0.013
    - 0.017
    - 0.021
    - 0.025
    - 0.029
    - 0.033
    - 0.037
    - 0.041
    - 0.045
    - 0.049
    - 0.053
    - 0.057
    - 0.061
    - 0.065
    - 0.069
    - 0.073
    - 0.077
    - 0.081
    - 0.085
    - 0.089
    - 0.093
    - 0.097
  injection_rate_unit: flits/node/cycle
  packet_size: 1
  traffic: uniform
  warmup_cycles: 10000
  sample_cycles: 50000
  max_samples: 10
  repetitions: 1
  num_vcs: 2
  vc_buffer_size: 8
  router_latency: 1
  timeout_seconds: 300

plot:
  y_scale: log
  emit_companion_plot: true

systems:
  - path: ../../systems/fattree/nca_hash/fattree_r8_l4_nca_hash.yaml
    case: fattree_r8_l4_nca_hash_256nodes
  - path: ../../systems/mesh2d/xy/mesh2d_16x16_xy.yaml
    case: mesh2d_16x16_xy_256nodes

booksim:
  executable: booksim
  backend: anynet_table

output_dir: runs

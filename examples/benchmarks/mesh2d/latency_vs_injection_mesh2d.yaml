benchmark:
  type: latency_vs_injection_rate
  injection_rates: [0.01, 0.02, 0.04, 0.08, 0.12, 0.16, 0.20]
  injection_rate_unit: flits/node/cycle
  packet_size: 1
  traffic: uniform
  warmup_cycles: 10000
  sample_cycles: 50000
  max_samples: 10
  repetitions: 3
  num_vcs: 2
  vc_buffer_size: 8
  router_latency: 1

systems:
  - ../../systems/mesh2d/xy/mesh2d_4x4_xy.yaml

booksim:
  executable: booksim
  backend: anynet_table

output_dir: runs

benchmark:
  type: latency_vs_injection_rate
  injection_rates: [0.01]
  injection_rate_unit: flits/node/cycle
  packet_size: 1
  traffic: uniform
  warmup_cycles: 100
  sample_cycles: 500
  max_samples: 1
  repetitions: 1
  num_vcs: 5
  vc_buffer_size: 4
  router_latency: 1
  timeout_seconds: 120
  stop_on_error: true

systems:
  - ../../systems/dragonfly/ugal_l_runtime/dragonfly_p2_a4_h2_ugal_l_runtime.yaml
  - ../../systems/dragonfly/valg_runtime/dragonfly_p2_a4_h2_valg_runtime.yaml
  - ../../systems/dragonfly/valn_runtime/dragonfly_p2_a4_h2_valn_runtime.yaml
  - ../../systems/dragonfly/par_runtime/dragonfly_p2_a4_h2_par_runtime.yaml
  - ../../systems/hypercube/min_adaptive_runtime/hypercube_d4_min_adaptive_runtime.yaml
  - ../../systems/hypercube/valiant_runtime/hypercube_d4_valiant_runtime.yaml
  - ../../systems/hypercube/ugal_l_runtime/hypercube_d4_ugal_l_runtime.yaml
  - ../../systems/slimnoc/ugal_l_runtime/slimnoc_q5_p4_ugal_l_runtime.yaml
  - ../../systems/slimnoc/ugal_g_runtime/slimnoc_q5_p4_ugal_g_runtime.yaml
  - ../../systems/slimnoc/valiant_runtime/slimnoc_q5_p4_valiant_runtime.yaml
  - ../../systems/lln/adaptive_layer_runtime/lln_4x4x5_adaptive_layer_runtime.yaml
  - ../../systems/ubmesh/apr_runtime/ubmesh_8x8_apr_runtime.yaml

booksim:
  executable: booksim
  backend: auto

plot:
  y_scale: log
  emit_companion_plot: false

output_dir: runs/system_regression

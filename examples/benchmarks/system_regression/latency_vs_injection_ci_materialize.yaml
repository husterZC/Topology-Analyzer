benchmark:
  type: latency_vs_injection_rate
  injection_rates: [0.001]
  injection_rate_unit: flits/node/cycle
  packet_size: 1
  traffic: uniform
  warmup_cycles: 100
  sample_cycles: 500
  max_samples: 1
  repetitions: 1
  num_vcs: 4
  vc_buffer_size: 4
  router_latency: 1
  timeout_seconds: 120
  stop_on_error: true

systems:
  - ../../systems/dragonfly/min/dragonfly_p2_a4_h2_min.yaml
  - ../../systems/dragonfly/valiant_hash/dragonfly_p2_a4_h2_valiant_hash.yaml

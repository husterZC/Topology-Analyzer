  - ../../systems/fattree/lca/fattree_r8_l4_lca.yaml
  - ../../systems/fattree/nca_hash/fattree_r8_l4_nca_hash.yaml
  - ../../systems/hypercube/ecube/hypercube_d4_ecube.yaml
  - ../../systems/hypercube/lash/hypercube_d4_lash.yaml
  - ../../systems/hypercube/valiant_hash/hypercube_d4_valiant_hash.yaml
  - ../../systems/lln/dor_fallback/lln_4x4x4_dor_fallback.yaml
  - ../../systems/lln/table/lln_4x4x5_table.yaml
  - ../../systems/mesh2d/graph_lash/mesh2d_2x2_graph_lash.yaml
  - ../../systems/mesh2d/graph_lash/mesh2d_4x4_graph_lash.yaml
  - ../../systems/mesh2d/graph_updown/mesh2d_2x2_graph_updown.yaml
  - ../../systems/mesh2d/graph_updown/mesh2d_4x4_graph_updown.yaml
  - ../../systems/mesh2d/graph_updown/mesh2d_8x8_graph_updown.yaml
  - ../../systems/mesh2d/link_variants/mesh2d_4x4_xy_oriented_links.yaml
  - ../../systems/mesh2d/link_variants/mesh2d_4x4_xy_pair_override.yaml
  - ../../systems/mesh2d/xy/mesh2d_16x16_xy.yaml
  - ../../systems/mesh2d/xy/mesh2d_2x2_xy.yaml
  - ../../systems/mesh2d/xy/mesh2d_4x4_xy.yaml
  - ../../systems/mesh2d/xy/mesh2d_8x8_xy.yaml
  - ../../systems/mesh3d/xyz/mesh3d_4x4x2_xyz.yaml

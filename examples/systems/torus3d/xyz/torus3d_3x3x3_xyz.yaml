name: torus3d_3x3x3_xyz

topology:
  type: torus3d
  params:
    x: 3
    y: 3
    z: 3

links:
  default:
    latency_cycles: 1
    bandwidth: 64GB/s
  classes:
    x_wrap:
      latency_cycles: 2
      bandwidth: 64GB/s
    y_wrap:
      latency_cycles: 2
      bandwidth: 64GB/s
    z_wrap:
      latency_cycles: 2
      bandwidth: 64GB/s

routing:
  type: torus_xyz

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topoanalyzer"
version = "0.1.0"
description = "NoC topology modeling, routing-table generation, and BookSim benchmarking harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "PyYAML>=6.0",
  "matplotlib>=3.7",
]

[project.scripts]
topoanalyzer = "topoanalyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
